# Onboard manifest for editor agent devkit. See ai/commands/ai-onboard.md.

commands:
  test-driven-implementation:
    slim_sections: [title, constraints, steps]
  commit:
    slim_sections: [title, constraints, steps, message_style]
  slice:
    slim_sections: [title, steps]

# All files under ai/templates/rules/ are copied to {editorRoot}/rules/
rules_glob: ai/templates/rules/*.mdc

# OpenSpec external vendor — copied as-is (not slimmed). Source: openspec/agent/
openspec_commands_dir: openspec/agent/commands
openspec_skills_dir: openspec/agent/skills

# Modular routing context — copied to {editorRoot}/context/
context_dir: ai/context

skill_stubs:
  - test-driven-development
  - dotnet-verification
  - implementation-planning
  - binance-net
  - chief-of-staff
  - commit
  - pr
  - ship-a-slice
